<!doctype html>

<html lang="en">
  <head>
    <title>Ferit Bawer Elhüseyni</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Shown inside the softwareEngineer bubble's iframe (js/app.js:
         engineerRevealUrl). LinkedIn sends x-frame-options: sameorigin and CSP
         frame-ancestors 'self' *.www.linkedin.com:*, so it can never be framed
         from here. img/linkedin.png is the screenshot, unmodified. -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #1d1109;
        overflow: hidden;
      }

      /* Top-left aligned, scaled to the width of the reveal frame. */
      img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>

  <body>
    <img src="./img/linkedin.png" alt="LinkedIn profile of Ferit Baver Elhüseyni">
  </body>
</html>
